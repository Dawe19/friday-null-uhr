services:
  spotify-weekly:
    build:
      context: ..
      dockerfile: container/Dockerfile
    container_name: spotify-weekly
    restart: unless-stopped
    init: true
    user: "${SPOTIFY_UID:-1000}:${SPOTIFY_GID:-1000}"
    environment:
      TZ: Europe/Berlin
      SPOTIFY_TIMEZONE: Europe/Berlin
      SPOTIFY_MARKET: DE
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:?Set SPOTIFY_CLIENT_ID in container/.env}
      SPOTIFY_PLAYLIST_ID: ${SPOTIFY_PLAYLIST_ID:?Set SPOTIFY_PLAYLIST_ID in container/.env}
      SPOTIFY_FRENCH_FAVORITES: ${SPOTIFY_FRENCH_FAVORITES:-}
      SPOTIFY_US_FAVORITES: ${SPOTIFY_US_FAVORITES:-}
      SPOTIFY_TOKEN_PATH: /data/.spotify-tokens.json
      SPOTIFY_NONINTERACTIVE: "1"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
